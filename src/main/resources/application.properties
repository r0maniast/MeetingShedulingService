spring.application.name=MeetingShedulingService

# Заполните токен через переменную окружения TELEGRAM_BOT_TOKEN, не храните его в Git.
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.api-url=https://api.telegram.org

# Для Supabase включите DATABASE_ENABLED=true и задайте значения ниже как переменные окружения.
# Пароль и строка подключения не должны попадать в Git.
app.database.enabled=${DATABASE_ENABLED:false}
app.database.url=${SUPABASE_DB_URL:}
app.database.username=${SUPABASE_DB_USERNAME:postgres}
app.database.password=${SUPABASE_DB_PASSWORD:}

spring.docker.compose.enabled=false